data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 224
  max_per_class: 1500   # cap per class so CPU training stays fast; raise for a fuller run
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42

train:
  model: simple_cnn
  epochs: 8
  batch_size: 32
  lr: 0.001
  num_workers: 2
  seed: 42

mlflow:
  experiment_name: cats-vs-dogs
  tracking_uri: mlruns
