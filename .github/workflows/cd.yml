name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository at the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Write deployment env file
        run: echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" > deployment/.env

      - name: Debug registry auth state
        run: |
          echo "--- docker config ---"
          cat ~/.docker/config.json 2>&1 || echo "no config file"
          echo "--- env auth vars ---"
          env | grep -iE "docker|ghcr|registry" || echo "none"
          echo "--- raw manifest fetch (no auth) ---"
          curl -sS -i "https://ghcr.io/v2/aswin-hash/mlops-assignment2-catsvsdogs/manifests/latest" \
            -H "Accept: application/vnd.oci.image.index.v1+json" | head -20
          echo "--- docker pull directly with -v ---"
          docker logout ghcr.io || true
          docker pull ghcr.io/aswin-hash/mlops-assignment2-catsvsdogs:latest 2>&1 || true

      - name: Pull new image and deploy
        working-directory: deployment
        run: |
          docker logout ghcr.io || true
          docker compose pull api
          docker compose up -d api

      - name: Set up Python for smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke tests against the deployed service
        run: |
          pip install requests pillow
          python deployment/smoke_test.py --base-url http://localhost:8000

      - name: Show service logs on failure
        if: failure()
        working-directory: deployment
        run: docker compose logs api

      - name: Tear down (ephemeral CI runner)
        if: always()
        working-directory: deployment
        run: docker compose down
