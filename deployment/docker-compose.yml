# Deployment-target compose: pulls the published image from the registry
# instead of building locally. This is what the CD pipeline (and you,
# simulating a "simple VM server") run to deploy/update the service.
#
# DEPLOY_IMAGE is provided via a .env file next to this one, e.g.:
#   DEPLOY_IMAGE=ghcr.io/<owner>/<repo>:latest
# (named distinctly from IMAGE_NAME to avoid colliding with the CI/CD
# workflows' own IMAGE_NAME env var, which docker compose would
# otherwise silently prefer over the .env file's value)
# Optionally set HOST_PORT too if 8000 is already taken on your machine.
services:
  api:
    image: ${DEPLOY_IMAGE}
    pull_policy: never
    ports:
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - api
    restart: unless-stopped
